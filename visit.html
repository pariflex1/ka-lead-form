<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calendly-Style Booking UI</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {margin:0;background:#f4f8fc;font-family:'Inter',Arial,sans-serif;}
    .calendly-main {
      display:flex;justify-content:center;align-items:center;
      min-height:0vh;
    }
    .calendly-card {
      display: flex; background: #fff;
      max-width: 100%; margin:0px;
      overflow: hidden; width:100%;
    }
    .calendly-details {
      flex:2 1 100%
      display:flex;flex-direction:column;
      min-width:100%;
    }
    .calendly-step-title {font-weight:700;font-size:1.43em;margin-bottom:8px;color:#143377;letter-spacing:-1px;}
    .calendly-step-desc {color:#4667ac;font-size:1em;margin-bottom:27px;}
    .calendly-steps-progress {display:flex;gap:12px;margin-bottom:18px;}
    .dot {width:14px;height:14px;border-radius:50%;background:#e2e9fd;}
    .dot.active {background:#2978ff;}
    .calendar-label {
      font-size:1em;
      font-weight:600;
      margin-bottom:7px;
      margin-top:4px;
      color:#377;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .calendar-label button {
      border: none;
      background: none;
      font-size: 1.7em;
      color: #2a4882;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 5px;
      transition: background 0.12s, color 0.12s;
      display: flex;
      align-items: center;
    }
    .calendar-label button:disabled {
      color: #c7d0e8;
      background: none;
      cursor: not-allowed;
    }
    .calendar-label span {
      min-width:120px;
      text-align:center;
      font-size:1.18em;
    }
    .calendar-grid {display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
    .calendar-grid button {
      border:none;background:#edf3ff;margin:0;font-size:1em;padding:14px 0;border-radius:7px;cursor:pointer;color:#224;
      transition:background 0.14s,color 0.15s;
    }
    .calendar-grid button:hover:not(:disabled),
    .calendar-grid button.selected {background:#2978ff;color:#fff;}
    .calendar-grid button:disabled {color:#ccc;opacity:0.7;cursor:default;}
    .calendar-grid .today {border:1.3px solid #2978ff;}
    .times-list {
      display: flex; /* Changed to flex */
      flex-wrap: wrap; /* Allows items to wrap to the next line */
      gap: 8px; /* Spacing between time slots */
      justify-content: center; /* Center the time slots */
      margin-top: 15px; /* Added some top margin for spacing */
    }
    .time-slot {
      background:#f0f4fd;border-radius:7px;border:1.3px solid transparent;
      padding: 8px 15px; /* Adjusted padding for inline */
      transition:.12s;font-weight:500;font-size:1em;color:#355;cursor:pointer;
      flex: 0 0 auto; /* Allow time slots to take natural width */
    }
    .time-slot.selected,.time-slot:hover {background:#2978ff;color:#fff;border-color: #99baff;}
    .book-form label {font-weight:600;display:block;margin-bottom:6px;}
    .book-form input[type="text"],.book-form input[type="tel"],.book-form textarea {
      padding:11px 14px;border:1.3px solid #deebf7;border-radius:6px;background:#f7fbff;width:100%;font-size:1em;margin-bottom:11px;
      transition:border .19s;
    }
    .book-form textarea {min-height: 55px;}
    .book-form input:focus,.book-form textarea:focus {border-color:#2978ff;background:#fff;}
    .book-form button[type="submit"] {
      background:linear-gradient(90deg,#186efc,#42a7ff 80%);
      color:#fff;font-weight:700;font-size:1.15em;border:none;border-radius:8px;
      width:100%;padding:15px;cursor:pointer;margin-top:12px;box-shadow:0 2px 10px #b1d6ff29;
      transition:background 0.17s,box-shadow .34s;
    }
    .book-form button[type="submit"]:hover {background:linear-gradient(90deg,#2054da,#2586e8);}
    .calendly-btns {display:flex;gap:14px;margin-top:20px;}
    .calendly-btns button {
      flex:1 1 0;background:#edf4fd;color:#123;border:none;padding:12px 0;border-radius:6px;font-weight:600;cursor:pointer;font-size:1em;transition:.17s;
    }
    .calendly-btns button.active,.calendly-btns button:hover {background:#2467da;color:#fff;}
    #status {
      margin-top:14px;
      padding:9px;
      border-radius:7px;
      text-align:center;
      font-weight:500;
    }
    .success {
      color:#236d42;
      background-color:#dbf6e3;
      border:1px solid #ade5bf;
    }
    .error {
      color:#a62020;
      background-color:#fae3e0;
      border:1px solid #edb8b0;
    }
    .hidden {display:none;}

    /* Popup Styles */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s, opacity 0.3s;
    }
    .popup-overlay.active {
      visibility: visible;
      opacity: 1;
    }
    .popup-content {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    .popup-content h2 {
      color: #143377;
      margin-bottom: 20px;
      font-size: 1.8em;
    }
    .popup-content p {
      margin-bottom: 10px;
      font-size: 1.1em;
      color: #4667ac;
    }
    .popup-content strong {
      color: #2978ff;
    }
    .close-popup {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 2em;
      color: #aaa;
      cursor: pointer;
      border: none;
      background: none;
    }
    .close-popup:hover {
      color: #666;
    }

    @media (max-width: 800px) {
      .calendly-card {flex-direction:column;max-width:98vw;}
      .calendly-details {padding:26px 7vw 28px 7vw;}
    }
  </style>
</head>
<body>
<div class="calendly-main">
  <div class="calendly-card">
    <div class="calendly-details">

      <div class="calendly-step-title" id="calendly-step-title">Select a Date & Time</div>
      <div class="calendly-step-desc" id="calendly-step-desc">Choose a day from the calendar.</div>
      <div class="calendly-steps-progress">
        <div class="dot active" id="step-dot-1"></div>
        <div class="dot" id="step-dot-2"></div>
        <div class="dot" id="step-dot-3"></div>
      </div>
      <div id="step-1">
        <div class="calendar-label" id="calendar-label">
          <button type="button" id="calendar-prev" aria-label="Previous month">&#x25C0;</button>
          <span id="calendar-month-text"></span>
          <button type="button" id="calendar-next" aria-label="Next month">&#x25B6;</button>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>
      <div id="step-2" style="display:none;">
        <div class="calendar-label">Select a time</div>
        <div class="times-list" id="times-list"></div>
        <div class="calendly-btns">
          <button type="button" onclick="showStep(1)">Back</button>
        </div>
      </div>
      <div id="step-3" style="display:none;">
        <form class="book-form" id="infoForm" autocomplete="off">
          <input type="hidden" name="Lead From" value="Krishna Anandam Website" />
          <input type="hidden" name="Site" value="Krishna Anandam" />
          <input type="hidden" name="Agent Name" value="RVMC" />
          <input type="hidden" name="Client Contact" value="919871124187" />
          <input type="hidden" id="page-url" name="Site Url" readonly />
          <input type="hidden" id="meeting-date" name="Meeting Date" />
          <input type="hidden" id="meeting-time" name="Meeting Time" />

          <label for="name">Name</label>
          <input type="text" id="name" name="Client Name" required autocomplete="name" placeholder="Your Name" />

          <label for="contact">Contact (Phone)</label>
          <input type="tel" id="contact" name="Contact" pattern="\d{10}" maxlength="10" required placeholder="9876543210" autocomplete="tel" />

          <label for="note">Note</label>
          <textarea id="note" name="Note" placeholder="Write a note for us..."></textarea>

          <button type="submit" id="submitButton">Confirm Booking</button>
        </form>
        <div class="calendly-btns">
          <button type="button" onclick="showStep(2)">Back</button>
        </div>
        <div id="status" class="hidden"></div>
        </div>
    </div>
  </div>
</div>

<div class="popup-overlay" id="thankYouPopup">
  <div class="popup-content">
    <button class="close-popup" onclick="closePopup()">&times;</button>
    <h2>Thank You for Your Booking!</h2>
    <p>Your meeting has been successfully confirmed. Here are the details you submitted:</p>
    <div id="popup-details">
      </div>
    <p style="margin-top: 20px;">We look forward to connecting with you!</p>
  </div>
</div>

<script>
const monthsToShow = 6;
let calendarMonthOffset = 0;
const today = new Date();
let selectedDate = null, selectedTime = null;

// --- Calendar rendering (multi-month, starting today) ---
function renderCalendar(monthOffset = 0) {
  const grid = document.getElementById('calendar-grid');
  let shownMonth = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  let month = shownMonth.getMonth(), year = shownMonth.getFullYear();
  let daysInMonth = new Date(year, month + 1, 0).getDate();
  let firstWeekDay = new Date(year, month, 1).getDay();

  // Render navigation label/text
  const monthText = shownMonth.toLocaleString('default', { month: 'long', year: 'numeric' });
  document.getElementById('calendar-month-text').textContent = monthText;
  document.getElementById('calendar-prev').disabled = (calendarMonthOffset === 0);
  document.getElementById('calendar-next').disabled = (calendarMonthOffset === monthsToShow-1);

  grid.innerHTML = '';
  for (let i = 0; i < firstWeekDay; ++i) grid.appendChild(document.createElement('span'));

  for (let d = 1; d <= daysInMonth; ++d) {
    let btn = document.createElement('button');
    btn.textContent = d;
    btn.type = 'button';
    let thisDay = new Date(year, month, d, 12, 0, 0, 0);
    if (thisDay < new Date(today.getFullYear(), today.getMonth(), today.getDate(), 0, 0, 0, 0)) btn.disabled = true;
    if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) btn.classList.add('today');
    btn.onclick = () => {
      selectedDate = new Date(year, month, d);
      document.querySelectorAll('#calendar-grid button').forEach(b=>b.classList.remove('selected','is-today'));
      btn.classList.add('selected');
      showStep(2);
      renderTimeSlots();
    };
    btn.id = 'daybtn-' + year + "-" + (month+1).toString().padStart(2,0) + "-" + d.toString().padStart(2,0);
    grid.appendChild(btn);
  }
}

// Month nav handlers
function nextCalendarMonth() {
  if(calendarMonthOffset < monthsToShow-1) {
    calendarMonthOffset++;
    renderCalendar(calendarMonthOffset);
  }
}
function prevCalendarMonth() {
  if(calendarMonthOffset > 0) {
    calendarMonthOffset--;
    renderCalendar(calendarMonthOffset);
  }
}

// --- Render Times: 8:00 to 19:30 in 30 min slots ---
function renderTimeSlots() {
  const times = [];
  for(let hour=8; hour<=19.5; hour++) {
    times.push(formatTime(hour,0));
    if(hour < 19.5) times.push(formatTime(hour,30));
  }
  const list = document.getElementById('times-list');
  list.innerHTML = '';
  times.forEach(t=>{
    let btn = document.createElement('button');
    btn.textContent = t;
    btn.type = 'button';
    btn.className = 'time-slot';
    btn.onclick = ()=>{
      document.querySelectorAll('.time-slot').forEach(e=>e.classList.remove('selected'));
      btn.classList.add('selected');
      selectedTime = t;
      document.getElementById('meeting-date').value = selectedDate.toISOString().substring(0,10);
      document.getElementById('meeting-time').value = selectedTime;
      setTimeout(()=>showStep(3), 300);
    };
    list.appendChild(btn);
  });
}
function formatTime(h, m) {
  const hour12 = (h % 12) || 12;
  const mins = m.toString().padStart(2,'0');
  const ampm = h < 12 ? 'AM' : 'PM';
  return `${hour12}:${mins} ${ampm}`;
}

function showStep(s) {
  for(let i=1;i<=3;++i) document.getElementById('step-'+i).style.display = (i===s?'block':'none');
  ['step-dot-1','step-dot-2','step-dot-3'].forEach((id,idx)=>{
    let d=document.getElementById(id);
    if(idx < s) d.classList.add('active'); else d.classList.remove('active');
    if(idx==s-1) d.classList.add('active'); else d.classList.remove('active');
  });
  const titles=[
    "Select a Date & Time",
    "Choose a Time",
    "Enter Details"
  ];
  const descs=[
    "Choose a day from the calendar.",
    selectedDate?"Pick a time for "+selectedDate.toLocaleDateString()+".":"Pick a time.",
    selectedDate && selectedTime?("Confirm your booking for <b>"+selectedDate.toLocaleDateString()+" at "+selectedTime+"</b>."):"Confirm your booking."
  ];
  document.getElementById('calendly-step-title').innerHTML=titles[s-1];
  document.getElementById('calendly-step-desc').innerHTML=descs[s-1];
  // document.getElementById('thank-you').style.display="none"; // This was for the old inline message
}

// ==== Form submission (Google Sheet & Make API) ====
const scriptURL = "https://script.google.com/macros/s/AKfycbzl2qAQSK0nCZH68HuIFxCFgccw_XH73JjCKbO9MnTAbd5JYgH-8_nifH50hVvrbT6H/exec"; // <--- UPDATE THIS
const webhookURL = "https://hook.eu2.make.com/375tbnh7cqhyrbab36s1ofrah6yaypfe";    // <--- UPDATE THIS
const webhookURL = "https://hook.eu1.make.com/qq1q993c9x4icmkbkvd5wcdvorvjffv8";    // <--- UPDATE THIS
// const redirectURL = "https://krishnaanandam.com"; // No longer needed for redirection
const form = document.getElementById('infoForm');
const submitButton = document.getElementById('submitButton');
const statusDiv = document.getElementById('status');
const contactInput = document.getElementById('contact');
const pageUrlInput = document.getElementById('page-url');
const thankYouPopup = document.getElementById('thankYouPopup');
const popupDetails = document.getElementById('popup-details');


form.addEventListener('submit', function(e) {
    e.preventDefault();

    pageUrlInput.value = window.location.href;
    const contactValue = contactInput.value.trim();
    const phoneRegex = /^\d{10}$/;
    if (!phoneRegex.test(contactValue)) {
        statusDiv.textContent = 'Contact number must be 10 digits.';
        statusDiv.className = 'error';
        statusDiv.classList.remove('hidden');
        contactInput.focus();
        return;
    }
    const prefixedContactValue = '91' + contactValue;

    submitButton.disabled = true;
    submitButton.textContent = 'Submitting...';
    statusDiv.textContent = '';
    statusDiv.className = 'hidden';

    // FormData for Google Apps Script
    const formData = new FormData(form);
    formData.set('Contact', prefixedContactValue);

    // JSON for webhook
    let jsonData = {};
    formData.forEach((value, key) => { jsonData[key] = value; });
    jsonData['Client Contact'] = document.querySelector('input[name="Client Contact"]').value;

    fetch(scriptURL, { method: 'POST', body: formData })
        .then(async response => {
            let isJson = response.headers.get("content-type")?.includes('application/json');
            let data = isJson ? await response.json() : await response.text();
            if (
                (isJson && data.result === "success")
                ||
                (!isJson && response.ok)
            ) {
                return fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jsonData)
                });
            } else {
                throw new Error(isJson ? (data.message || "Google Apps Script: Failed") : ("Google Apps Script: "+data));
            }
        })
        .then(webhookResponse => {
            if (webhookResponse.ok) {
                // Populate and show popup instead of redirecting
                populatePopup(formData); // Pass formData to populate the popup
                showPopup();
                form.reset(); // Reset form after successful submission
                showStep(1); // Go back to step 1 (calendar) after submission
            } else {
                return webhookResponse.json().then(errorData => {
                    throw new Error(`Webhook error: ${errorData.message || webhookResponse.statusText}`);
                });
            }
        })
        .catch(error => {
            console.error('Submission error:', error);
            statusDiv.textContent = 'Error! Could not submit form. ' + error.message;
            statusDiv.className = 'error';
            statusDiv.classList.remove('hidden');
        })
        .finally(() => {
            submitButton.disabled = false;
            submitButton.textContent = 'Confirm Booking';
        });
});

// --- Popup Functions ---
function showPopup() {
  thankYouPopup.classList.add('active');
}

function closePopup() {
  thankYouPopup.classList.remove('active');
}

function populatePopup(formData) {
  popupDetails.innerHTML = ''; // Clear previous content
  const details = {
    "Name": formData.get('Client Name'),
    "Contact": formData.get('Contact').substring(2), // Remove '91' prefix for display
    "Meeting Date": formData.get('Meeting Date'),
    "Meeting Time": formData.get('Meeting Time'),
    "Note": formData.get('Note')
  };

  for (const key in details) {
    if (details[key]) { // Only display fields that have a value
      const p = document.createElement('p');
      p.innerHTML = `<strong>${key}:</strong> ${details[key]}`;
      popupDetails.appendChild(p);
    }
  }
}

// --- Initial calendar setup
document.addEventListener("DOMContentLoaded", function() {
  renderCalendar();
  showStep(1);
  document.getElementById('calendar-prev').onclick = prevCalendarMonth;
  document.getElementById('calendar-next').onclick = nextCalendarMonth;
});
window.renderCalendar = renderCalendar;
window.nextCalendarMonth = nextCalendarMonth;
window.prevCalendarMonth = prevCalendarMonth;
window.showStep = showStep;
window.closePopup = closePopup; // Make closePopup globally accessible for the button
</script>
</body>
</html>
