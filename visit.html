<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Krishna Anandam - Booking</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #f4f8fc;
      font-family: 'Inter', Arial, sans-serif;
    }

    .calendly-main {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }

    .calendly-card {
      display: flex;
      background: #fff;
      max-width: 50%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    .calendly-details {
      flex: 2 1 100%;
      display: flex;
      flex-direction: column;
      min-width: 100%;
    }

    .calendly-step-title {
      font-weight: 700;
      font-size: 1.43em;
      margin-bottom: 8px;
      color: #143377;
      letter-spacing: -1px;
    }

    .calendly-step-desc {
      color: #4667ac;
      font-size: 1em;
      margin-bottom: 27px;
    }

    .calendly-steps-progress {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #e2e9fd;
    }

    .dot.active {
      background: #2978ff;
    }

    .calendar-label {
      font-size: 1em;
      font-weight: 600;
      margin-bottom: 7px;
      margin-top: 4px;
      color: #377;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .calendar-label button {
      border: none;
      background: none;
      font-size: 1.7em;
      color: #2a4882;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 5px;
      transition: background 0.12s, color 0.12s;
      display: flex;
      align-items: center;
    }

    .calendar-label button:disabled {
      color: #c7d0e8;
      background: none;
      cursor: not-allowed;
    }

    .calendar-label span {
      min-width: 120px;
      text-align: center;
      font-size: 1.18em;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .calendar-grid button {
      border: none;
      background: #edf3ff;
      margin: 0;
      font-size: 1em;
      padding: 14px 0;
      border-radius: 7px;
      cursor: pointer;
      color: #224;
      transition: background 0.14s, color 0.15s;
    }

    .calendar-grid button:hover:not(:disabled),
    .calendar-grid button.selected {
      background: #2978ff;
      color: #fff;
    }

    .calendar-grid button:disabled {
      color: #ccc;
      opacity: 0.7;
      cursor: default;
    }

    .calendar-grid .today {
      border: 1.3px solid #2978ff;
    }

    .times-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 15px;
    }

    .time-slot {
      background: #f0f4fd;
      border-radius: 7px;
      border: 1.3px solid transparent;
      padding: 8px 15px;
      transition: .12s;
      font-weight: 500;
      font-size: 1em;
      color: #355;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .time-slot.selected,
    .time-slot:hover {
      background: #2978ff;
      color: #fff;
      border-color: #99baff;
    }

    .book-form label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }

    .book-form input[type="text"],
    .book-form input[type="tel"],
    .book-form textarea {
      padding: 11px 14px;
      border: 1.3px solid #deebf7;
      border-radius: 6px;
      background: #f7fbff;
      width: 100%;
      font-size: 1em;
      margin-bottom: 11px;
      transition: border .19s;
      box-sizing: border-box;
    }

    .book-form textarea {
      min-height: 55px;
      resize: vertical;
    }

    .book-form input:focus,
    .book-form textarea:focus {
      border-color: #2978ff;
      background: #fff;
      outline: none;
    }

    .book-form button[type="submit"] {
      background: linear-gradient(90deg, #186efc, #42a7ff 80%);
      color: #fff;
      font-weight: 700;
      font-size: 1.15em;
      border: none;
      border-radius: 8px;
      width: 100%;
      padding: 15px;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 2px 10px #b1d6ff29;
      transition: background 0.17s, box-shadow .34s;
    }

    .book-form button[type="submit"]:hover {
      background: linear-gradient(90deg, #2054da, #2586e8);
    }

    .book-form button[type="submit"]:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .calendly-btns {
      display: flex;
      gap: 14px;
      margin-top: 20px;
    }

    .calendly-btns button {
      flex: 1 1 0;
      background: #edf4fd;
      color: #123;
      border: none;
      padding: 12px 0;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1em;
      transition: .17s;
    }

    .calendly-btns button.active,
    .calendly-btns button:hover {
      background: #2467da;
      color: #fff;
    }

    #status {
      margin-top: 14px;
      padding: 9px;
      border-radius: 7px;
      text-align: center;
      font-weight: 500;
    }

    .success {
      color: #236d42;
      background-color: #dbf6e3;
      border: 1px solid #ade5bf;
    }

    .error {
      color: #a62020;
      background-color: #fae3e0;
      border: 1px solid #edb8b0;
    }

    .hidden {
      display: none;
    }

    /* =========================
       THANK YOU POPUP
       ========================= */

    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s, opacity 0.2s;
    }

    .popup-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .popup-content {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
      position: relative;
      box-sizing: border-box;
    }

    .popup-content h2 {
      color: #143377;
      margin: 0 0 15px;
      font-size: 1.8em;
    }

    .popup-content p {
      margin-bottom: 10px;
      font-size: 1.05em;
      color: #4667ac;
      line-height: 1.5;
    }

    .popup-content strong {
      color: #2978ff;
    }

    .redirect-text {
      margin-top: 20px !important;
      font-size: 0.9em !important;
      color: #777 !important;
    }

    @media (max-width: 800px) {
      .calendly-card {
        flex-direction: column;
        max-width: 98vw;
      }

      .calendly-details {
        padding: 26px 7vw 28px 7vw;
        box-sizing: border-box;
      }
    }

    @media (max-width: 480px) {
      .calendly-step-title {
        font-size: 1.25em;
      }

      .calendly-step-desc {
        font-size: 0.95em;
        margin-bottom: 20px;
      }

      .calendar-grid button {
        padding: 12px 0;
        font-size: 0.95em;
      }

      .time-slot {
        padding: 8px 12px;
        font-size: 0.9em;
      }

      .popup-content {
        padding: 25px 20px;
      }
    }
  </style>

</head>

<script>

/* =====================================================
   CONFIGURATION
   ===================================================== */

const monthsToShow = 6;

/*
 * Google Apps Script
 */
const scriptURL =
"https://script.google.com/macros/s/AKfycbzl2qAQSK0nCZH68HuIFxCFgccw_XH73JjCKbO9MnTAbd5JYgH-8_nifH50hVvrbT6H/exec";

/*
 * Make Webhook
 */
const webhookURL =
"https://hook.eu2.make.com/375tbnh7cqhyrbab36s1ofrah6yaypfe";

/*
 * Redirect URL after successful submission
 */
const redirectURL =
"https://krishnaanandam.com";


/* =====================================================
   CALENDAR VARIABLES
   ===================================================== */

let calendarMonthOffset = 0;

const today = new Date();

let selectedDate = null;
let selectedTime = null;


/* =====================================================
   CALENDAR RENDER
   ===================================================== */

function renderCalendar(monthOffset = 0) {

  const grid =
    document.getElementById('calendar-grid');

  let shownMonth =
    new Date(
      today.getFullYear(),
      today.getMonth() + monthOffset,
      1
    );

  let month =
    shownMonth.getMonth();

  let year =
    shownMonth.getFullYear();

  let daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();

  let firstWeekDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  /* Month title */

  const monthText =
    shownMonth.toLocaleString(
      'default',
      {
        month: 'long',
        year: 'numeric'
      }
    );

  document.getElementById(
    'calendar-month-text'
  ).textContent = monthText;


  /* Navigation */

  document.getElementById(
    'calendar-prev'
  ).disabled =
    calendarMonthOffset === 0;

  document.getElementById(
    'calendar-next'
  ).disabled =
    calendarMonthOffset === monthsToShow - 1;


  /* Clear calendar */

  grid.innerHTML = '';


  /* Empty spaces before first day */

  for (
    let i = 0;
    i < firstWeekDay;
    ++i
  ) {

    grid.appendChild(
      document.createElement('span')
    );

  }


  /* Create days */

  for (
    let d = 1;
    d <= daysInMonth;
    ++d
  ) {

    let btn =
      document.createElement('button');

    btn.textContent = d;
    btn.type = 'button';


    let thisDay =
      new Date(
        year,
        month,
        d,
        12,
        0,
        0,
        0
      );


    /* Disable previous dates */

    if (
      thisDay <
      new Date(
        today.getFullYear(),
        today.getMonth(),
        today.getDate(),
        0,
        0,
        0,
        0
      )
    ) {

      btn.disabled = true;

    }


    /* Mark today */

    if (
      d === today.getDate() &&
      month === today.getMonth() &&
      year === today.getFullYear()
    ) {

      btn.classList.add('today');

    }


    /* Date click */

    btn.onclick = () => {

      selectedDate =
        new Date(
          year,
          month,
          d
        );


      document
        .querySelectorAll(
          '#calendar-grid button'
        )
        .forEach(
          b =>
            b.classList.remove(
              'selected',
              'is-today'
            )
        );


      btn.classList.add('selected');


      showStep(2);

      renderTimeSlots();

    };


    btn.id =
      'daybtn-' +
      year +
      "-" +
      (month + 1)
        .toString()
        .padStart(2, '0') +
      "-" +
      d
        .toString()
        .padStart(2, '0');


    grid.appendChild(btn);

  }

}


/* =====================================================
   MONTH NAVIGATION
   ===================================================== */

function nextCalendarMonth() {

  if (
    calendarMonthOffset <
    monthsToShow - 1
  ) {

    calendarMonthOffset++;

    renderCalendar(
      calendarMonthOffset
    );

  }

}


function prevCalendarMonth() {

  if (
    calendarMonthOffset > 0
  ) {

    calendarMonthOffset--;

    renderCalendar(
      calendarMonthOffset
    );

  }

}


/* =====================================================
   TIME SLOTS
   8:00 AM - 7:30 PM
   ===================================================== */

function renderTimeSlots() {

  const times = [];


  for (
    let hour = 8;
    hour <= 19.5;
    hour++
  ) {

    times.push(
      formatTime(hour, 0)
    );


    if (
      hour < 19.5
    ) {

      times.push(
        formatTime(hour, 30)
      );

    }

  }


  const list =
    document.getElementById(
      'times-list'
    );


  list.innerHTML = '';


  times.forEach(t => {

    let btn =
      document.createElement(
        'button'
      );

    btn.textContent = t;

    btn.type = 'button';

    btn.className =
      'time-slot';


    btn.onclick = () => {

      document
        .querySelectorAll(
          '.time-slot'
        )
        .forEach(
          e =>
            e.classList.remove(
              'selected'
            )
        );


      btn.classList.add(
        'selected'
      );


      selectedTime = t;


      document.getElementById(
        'meeting-date'
      ).value =
        selectedDate
          .toISOString()
          .substring(0, 10);


      document.getElementById(
        'meeting-time'
      ).value =
        selectedTime;


      /*
       * Small delay so selected
       * button animation is visible
       */
      setTimeout(
        () => showStep(3),
        200
      );

    };


    list.appendChild(btn);

  });

}


/* =====================================================
   TIME FORMAT
   ===================================================== */

function formatTime(h, m) {

  const hour12 =
    (h % 12) || 12;

  const mins =
    m.toString().padStart(
      2,
      '0'
    );

  const ampm =
    h < 12
      ? 'AM'
      : 'PM';


  return `${hour12}:${mins} ${ampm}`;

}


/* =====================================================
   SHOW STEP
   ===================================================== */

function showStep(s) {

  for (
    let i = 1;
    i <= 3;
    ++i
  ) {

    document.getElementById(
      'step-' + i
    ).style.display =
      i === s
        ? 'block'
        : 'none';

  }


  /*
   * Progress dots
   */

  ['step-dot-1',
   'step-dot-2',
   'step-dot-3'
  ].forEach(
    (id, idx) => {

      let d =
        document.getElementById(id);


      if (
        idx < s
      ) {

        d.classList.add(
          'active'
        );

      } else {

        d.classList.remove(
          'active'
        );

      }

    }
  );


  /*
   * Titles
   */

  const titles = [

    "Select a Date & Time",

    "Choose a Time",

    "Enter Details"

  ];


  /*
   * Descriptions
   */

  const descs = [

    "Choose a day from the calendar.",

    selectedDate
      ? "Pick a time for " +
        selectedDate.toLocaleDateString() +
        "."
      : "Pick a time.",

    selectedDate &&
    selectedTime

      ? "Confirm your booking for <b>" +
        selectedDate.toLocaleDateString() +
        " at " +
        selectedTime +
        "</b>."

      : "Confirm your booking."

  ];


  document.getElementById(
    'calendly-step-title'
  ).innerHTML =
    titles[s - 1];


  document.getElementById(
    'calendly-step-desc'
  ).innerHTML =
    descs[s - 1];

}


/* =====================================================
   FORM ELEMENTS
   ===================================================== */

const form =
  document.getElementById(
    'infoForm'
  );

const submitButton =
  document.getElementById(
    'submitButton'
  );

const statusDiv =
  document.getElementById(
    'status'
  );

const contactInput =
  document.getElementById(
    'contact'
  );

const pageUrlInput =
  document.getElementById(
    'page-url'
  );

const thankYouPopup =
  document.getElementById(
    'thankYouPopup'
  );

const popupDetails =
  document.getElementById(
    'popup-details'
  );


/* =====================================================
   FAST FORM SUBMISSION
   ===================================================== */

form.addEventListener(
  'submit',
  async function(e) {

    e.preventDefault();


    /*
     * Store current page URL
     */

    pageUrlInput.value =
      window.location.href;


    /*
     * Validate phone
     */

    const contactValue =
      contactInput.value.trim();

    const phoneRegex =
      /^\d{10}$/;


    if (
      !phoneRegex.test(
        contactValue
      )
    ) {

      statusDiv.textContent =
        'Contact number must be 10 digits.';

      statusDiv.className =
        'error';

      statusDiv.classList.remove(
        'hidden'
      );

      contactInput.focus();

      return;

    }


    /*
     * Add India country code
     */

    const prefixedContactValue =
      '91' +
      contactValue;


    /*
     * Disable submit immediately
     */

    submitButton.disabled =
      true;

    submitButton.textContent =
      'Submitting...';


    statusDiv.className =
      'hidden';

    statusDiv.textContent =
      '';


    /*
     * Create FormData
     */

    const formData =
      new FormData(form);


    formData.set(
      'Contact',
      prefixedContactValue
    );


    /*
     * Create JSON for Make
     */

    const jsonData = {};


    formData.forEach(
      (value, key) => {

        jsonData[key] =
          value;

      }
    );


    jsonData['Client Contact'] =
      document.querySelector(
        'input[name="Client Contact"]'
      ).value;


    try {

      /*
       * =================================================
       * SEND BOTH REQUESTS AT THE SAME TIME
       * =================================================
       */

      const googleRequest =
        fetch(
          scriptURL,
          {
            method: 'POST',
            body: formData,
            keepalive: true
          }
        );


      const webhookRequest =
        fetch(
          webhookURL,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify(
                jsonData
              ),

            keepalive: true
          }
        );


      /*
       * Wait for both
       */

      const [
        googleResponse,
        webhookResponse
      ] =
        await Promise.all([
          googleRequest,
          webhookRequest
        ]);


      /*
       * =================================================
       * GOOGLE RESPONSE
       * =================================================
       */

      let googleSuccess =
        false;


      try {

        const contentType =
          googleResponse
            .headers
            .get(
              "content-type"
            ) || "";


        if (
          contentType.includes(
            "application/json"
          )
        ) {

          const googleData =
            await googleResponse.json();


          googleSuccess =
            googleResponse.ok &&
            googleData.result ===
              "success";

        } else {

          googleSuccess =
            googleResponse.ok;

        }

      } catch (err) {

        googleSuccess =
          googleResponse.ok;

      }


      /*
       * =================================================
       * MAKE RESPONSE
       * =================================================
       */

      const webhookSuccess =
        webhookResponse.ok;


      /*
       * Both failed
       */

      if (
        !googleSuccess &&
        !webhookSuccess
      ) {

        throw new Error(
          "Submission failed. Please try again."
        );

      }


      /*
       * =================================================
       * SUCCESS
       * =================================================
       */

      populatePopup(
        formData
      );


      showPopup();


      /*
       * Reset form
       */

      form.reset();


      /*
       * Return to calendar
       */

      showStep(1);


      /*
       * =================================================
       * REDIRECT
       * =================================================
       *
       * Popup is visible for 1.5 seconds.
       */

      setTimeout(
        function() {

          window.location.href =
            redirectURL;

        },
        1500
      );


    } catch (error) {

      console.error(
        "Submission error:",
        error
      );


      statusDiv.textContent =
        "Error! Could not submit form. Please try again.";


      statusDiv.className =
        "error";


      statusDiv.classList.remove(
        'hidden'
      );


      submitButton.disabled =
        false;


      submitButton.textContent =
        "Confirm Booking";

    }

  }
);


/* =====================================================
   POPUP
   ===================================================== */

function showPopup() {

  thankYouPopup.classList.add(
    'active'
  );

}


function closePopup() {

  thankYouPopup.classList.remove(
    'active'
  );

}

function populatePopup(
  formData
) {

  /*

   * displays all personal details.
   * This keeps the confirmation
   * quick and clean.
   */

  if (!popupDetails) {
    return;
  }

  popupDetails.innerHTML = '';

}
